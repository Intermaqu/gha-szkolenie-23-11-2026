name: 04 – Using Actions
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Show OS
        uses: actions/checkout@v6
      - name: Checkout Code
        uses: actions/setup-node@v7
        with: 
          node-version: '24.x'
      - name: Install Dependencies
        working-directory: CWICZENIA/04-praca-z-zewnetrzymi-akcjami/react-app
        run: npm ci
      - name: Run Unit Tests
        working-directory: CWICZENIA/04-praca-z-zewnetrzymi-akcjami/react-app
        run: npm run test
  
          
      
  