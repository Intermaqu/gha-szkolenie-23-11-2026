name: 04 – Using Actions
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Show OS
        uses: actions/checkout@v6
      - name: Checkout Code
        uses: actions/setup-node@v24
      - name: Install Dependencies
        working-directory: CWICZENIA/04-praca-z-zewnetrzymi-akcjami/react-app
        run: npm ci
  
          
      
  