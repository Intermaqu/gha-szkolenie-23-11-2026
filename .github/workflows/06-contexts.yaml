name: 06 – Contexts
on: 
  workflow_dispatch:
    inputs:
      city: 
        required: true
        type: string

  # pull_request:
  #   types: [opened, synchronize]
  #   branches: [main]

jobs:
  echo-data:
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout
        uses: actions/checkout@v3

      - name: Pobierz informacje o pogodzie
        working-directory: ./CWICZENIA/06-context/pogoda
        run: |
          ./start.sh ${{ inputs.city }} ${{ env.MY_KLUCZYK }} >> $GITHUB_STEP_SUMMARY